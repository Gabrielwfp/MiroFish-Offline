services:
  mirofish:
    build: .
    # Or use pre-built image (when available):
    # image: ghcr.io/nikmcfly/mirofish-offline:latest
    container_name: mirofish-offline
    env_file:
      - .env
    # Inside the container `localhost` is the container itself, so the host-oriented values in
    # .env (NEO4J_URI=bolt://localhost:7687, EMBEDDING_BASE_URL=http://localhost:...) never connect.
    # `environment` wins over `env_file`; LLM_BASE_URL is left to .env (it may be a LAN address).
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - EMBEDDING_BASE_URL=http://host.docker.internal:11434/v1
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    # Lets the container reach an LLM server on the host (omlx/Ollama) as host.docker.internal.
    # Built into Docker Desktop (macOS/Windows); this mapping makes it work on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/uploads:/app/backend/uploads
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5.18-community
    container_name: mirofish-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-mirofish}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
